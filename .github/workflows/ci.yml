name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # No provider credentials exist in CI. The suite must never need one.
      PROBATIO_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Gate condition 5 diffs examples/demo_suite against the commit that introduced
          # it; a shallow clone has no such commit and the check would pass vacuously.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Gate 1 — pytest
        run: pytest -q

      - name: Gate 2 — coverage of src/probatio at least 85%
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=85

      - name: Gate 3 — ruff
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: Gate 4 — mypy --strict
        run: mypy --strict src/probatio
