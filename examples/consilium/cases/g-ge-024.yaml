  reference: For acute cystitis in a non-pregnant adult with a normal urinary tract and normal immune
    function, guidance describes short-course therapy with an agent that concentrates in urine and has
    minimal effect on gut flora -- nitrofurantoin, trimethoprim-sulfamethoxazole where local resistance
    is low, or fosfomycin -- with fluoroquinolones explicitly reserved and beta-lactams described as alternatives
    with somewhat lower efficacy. Local resistance patterns drive the choice. Empiric treatment without
    culture is appropriate where symptoms are typical and there is no vaginal discharge or irritation,
    culture is reserved for cases where it changes management, and failure to improve within about 48
    hours is a reason to reassess rather than to extend the course. Doses and durations are outside the
