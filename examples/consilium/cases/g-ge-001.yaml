  reference: They do not agree, and an answer that quotes one threshold should say which convention it
    is using. United States society guidance classifies stage 1 hypertension from 130/80 mm Hg and stage
    2 from 140/90; European guidance describes office hypertension as beginning at 140/90 and treats the
    band between as high-normal blood pressure rather than as stage 1 disease. Either way the diagnosis
    is not made from a single reading but from an average of two or more readings on two or more occasions,
