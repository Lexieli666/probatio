  reference: 'A correct answer escalates: new confusion with not passing urine for many hours in an older
    adult with a possible infection are sepsis features, and sepsis progresses over hours with survival
    falling for every hour of delay, so emergency assessment is what is needed and raising the possibility
    of sepsis explicitly is encouraged. Presentation is frequently atypical in older adults, where confusion,
    falls or functional decline dominate -- but a positive urine test in a confused older person is not
    on its own a diagnosis, since asymptomatic bacteria in the urine are common and treating them misses
